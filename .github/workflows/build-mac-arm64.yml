name: build-mac-arm64

on:
  workflow_dispatch:
  push:
    branches:
      - claude/double-commander-github-actions-fmfdlf

jobs:
  build-mac-arm64:
    runs-on: macos-15
    steps:
    - name: Restore fpc from cache
      id: fpc-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/fpc-dmg
        key: ${{ runner.os }}-fpc

    - name: Download fpc from site
      if: steps.fpc-restore.outputs.cache-hit != 'true'
      run: |
            curl -L -o "${{ runner.temp }}/fpc.dmg" \
              https://github.com/doublecmd/fpc-3.2.x/releases/download/v3.2.4-rc2/fpc-3.2.4-rc2-aarch64-macosx.dmg
            hdiutil attach "${{ runner.temp }}/fpc.dmg" -mountpoint "${{ runner.temp }}/fpc-dmg"

    - name: Save fpc to cache
      if: steps.fpc-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/fpc-dmg
        key: ${{ runner.os }}-fpc

    - name: Install Free Pascal
      run: |
           sudo installer -pkg "${{ runner.temp }}/fpc-dmg/fpc-3.2.4-rc2-aarch64-macosx.pkg" -target /
           sudo fpcmkcfg -d "basepath=/usr/local/lib/fpc/3.2.4" -o /etc/fpc.cfg

    - name: Get Lazarus source
      uses: actions/checkout@v7
      with:
            repository: 'fpc/Lazarus'

    - name: Build and install Lazarus
      run: |
           make all
           sudo make install

    - name: Create Lazarus config
      run: |
           mkdir -p $HOME/.lazarus
           cp tools/install/macosx/environmentoptions.xml $HOME/.lazarus/environmentoptions.xml
           sed -i -e "s|_PPCARCH_|fpc|g; s|/Developer/lazarus|/usr/local/share/lazarus|g" $HOME/.lazarus/environmentoptions.xml

    - name: Checkout source
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Build package
      run: ./.github/scripts/create_mac_arm64.sh

    - name: Upload dmg
      uses: actions/upload-artifact@v7
      with:
        name: doublecmd-mac-arm64
        retention-days: 14
        compression-level: 0
        path: doublecmd-release/doublecmd*.dmg
